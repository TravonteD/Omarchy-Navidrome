[package]
name = "omarchy-navidrome-backend"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
license = "MIT"
description = "Plugin-owned Navidrome streaming playback backend for Omarchy Navidrome"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
env_logger = { version = "0.11", default-features = false }
fastrand = "2.5"
log = "0.4"
md-5 = "0.10"
mpris-server = { version = "=0.10.0", features = ["tokio"] }
rodio = { version = "0.23", default-features = false, features = ["playback"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Symphonia has no Opus decoder, so Opus sources rely on server-side
# transcoding; everything else is decoded locally.
symphonia = { version = "0.5.4", default-features = false, features = [
    "aac",
    "flac",
    "isomp4",
    "mp3",
    "ogg",
    "pcm",
    "vorbis",
    "wav",
] }
tokio = { version = "1.47", features = ["io-util", "macros", "net", "rt", "signal", "sync", "time"] }
toml = "0.9"
ureq = { version = "2.10", default-features = false, features = ["tls"] }

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
panic = "abort"
